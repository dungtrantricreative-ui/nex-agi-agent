<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>
</head>
<body class="bg-white h-screen overflow-hidden">

    <div class="flex flex-col min-w-0 h-full">
        <header class="border-b border-gray-100 px-6 py-3 flex justify-between items-center shrink-0 bg-white">
            <div class="flex items-center gap-3">
                <span class="text-sm font-medium text-gray-900"></span>
                <span id="processing-badge" class="hidden items-center gap-1.5 text-xs text-gray-500 bg-gray-100 px-2.5 py-1 rounded-full">
                    <span class="w-1.5 h-1.5 rounded-full bg-orange-400 animate-pulse"></span>
                    Đang xử lý...
                </span>
            </div>
            <div class="flex items-center gap-1">
                <button class="p-1.5 text-gray-400 hover:text-gray-700 rounded-md hover:bg-gray-100 transition-colors">
                    <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M10 2H13V5M13 2L9 6M5 13H2V10M2 13L6 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button class="p-1.5 text-gray-400 hover:text-gray-700 rounded-md hover:bg-gray-100 transition-colors">
                    <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="3" r="1" fill="currentColor"/><circle cx="7.5" cy="7.5" r="1" fill="currentColor"/><circle cx="7.5" cy="12" r="1" fill="currentColor"/></svg>
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto" id="chat-scroll">
            <div id="chat-container" class="max-w-3xl mx-auto px-6 py-8 space-y-6">
                <div id="welcome-screen" class="flex flex-col items-center justify-center pt-16 pb-8 text-center">
                    <div class="w-10 h-10 rounded-xl bg-black flex items-center justify-center mb-5">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2L18 10L10 18M2 10H18" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </div>
                    <h3 class="text-xl font-semibold text-gray-900 mb-2">Không gian làm việc Đặc vụ AI</h3>
                    <p class="text-sm text-gray-500 max-w-sm leading-relaxed">Nhập văn bản yêu cầu hoặc ra lệnh tại đây. Đặc vụ sẽ tự động phân tích, gọi công cụ thực thi và trả về kết quả.</p>
                </div>
            </div>
        </main>

        <div class="bg-white border-t border-gray-100 px-6 py-4 shrink-0">
            <div class="max-w-3xl mx-auto">
                <div class="relative border border-gray-200 rounded-xl bg-white shadow-sm focus-within:border-gray-400 transition-colors">
                    <textarea
                        id="input-text"
                        rows="3"
                        class="w-full px-4 pt-3.5 pb-12 text-sm text-gray-900 placeholder-gray-400 resize-none bg-transparent focus:outline-none rounded-xl"
                        placeholder="Nhập văn bản cần xử lý hoặc ra lệnh tại đây..."
                    ></textarea>
                    <div class="absolute bottom-0 left-0 right-0 px-3 py-2.5 flex items-center justify-between border-t border-gray-100">
                        <span class="text-xs text-gray-400"><span id="char-count">0</span> ký tự · Ctrl+Enter</span>
                        <button id="submit-btn" class="flex items-center gap-2 bg-black hover:bg-gray-800 text-white text-xs font-medium px-4 py-2 rounded-lg transition-colors disabled:opacity-40">
                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1L11 6L6 11M1 6H11" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            Thực hiện
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <template id="user-message-template">
        <div class="flex justify-end">
            <div class="user-bubble bg-[#f4f4f4] text-gray-900 px-4 py-3 rounded-2xl rounded-br-md max-w-[75%] text-sm leading-relaxed">
                <p class="whitespace-pre-wrap"></p>
            </div>
        </div>
    </template>

    <template id="steps-block-template">
        <div class="steps-block">
            <button class="steps-toggle flex items-center gap-2 text-xs text-gray-500 hover:text-gray-700 transition-colors py-1 select-none">
                <svg class="steps-chevron w-3 h-3 transition-transform" viewBox="0 0 12 12" fill="none"><path d="M4 5L6 7L8 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="steps-label">Đã thực thi <span class="steps-count font-medium text-gray-700">0</span> tác vụ</span>
                <span class="steps-done-badge hidden items-center gap-1 text-green-600">
                    <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M2 5.5L4.5 8L9 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Hoàn thành
                </span>
            </button>
            <div class="steps-list hidden mt-1 ml-5 space-y-2 border-l border-gray-100 pl-3 pb-1">
                </div>
        </div>
    </template>

    <template id="step-item-template">
        <div class="step-item flex items-start gap-2.5 py-1">
            <div class="step-icon mt-0.5 shrink-0"></div>
            <div class="flex-1 min-w-0">
                <p class="step-name text-xs font-medium text-gray-800 leading-tight"></p>
                <p class="step-msg text-xs text-gray-500 mt-0.5 leading-tight"></p>
            </div>
        </div>
    </template>

    <template id="ai-message-template">
        <div class="ai-message-wrapper">
            <div class="ai-bubble text-gray-900 text-sm leading-relaxed">
                <div class="markdown-body"></div>
                <div class="flex items-center gap-1 pt-2 border-t border-gray-100">
                    <button class="like-btn flex items-center gap-1 text-xs text-gray-400 hover:text-gray-700 px-2 py-1 rounded-md hover:bg-gray-100 transition-colors">
                        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M4 12V6L7 1L7.5 1.5C8 2.5 7.5 4 7.5 4H11C11.6 4 12 4.5 12 5L11 9C10.8 9.6 10.3 10 9.7 10H4M2 10V6H4V10H2" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
                    </button>
                    <button class="dislike-btn flex items-center gap-1 text-xs text-gray-400 hover:text-gray-700 px-2 py-1 rounded-md hover:bg-gray-100 transition-colors">
                        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M9 1V7L6 12L5.5 11.5C5 10.5 5.5 9 5.5 9H2C1.4 9 1 8.5 1 8L2 4C2.2 3.4 2.7 3 3.3 3H9M11 3V7H9V3H11" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
                    </button>
                    <button class="copy-btn flex items-center gap-1.5 text-xs text-gray-400 hover:text-gray-700 px-2 py-1 rounded-md hover:bg-gray-100 transition-colors ml-auto">
                        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M4 4V2.5C4 1.7 4.7 1 5.5 1H10.5C11.3 1 12 1.7 12 2.5V7.5C12 8.3 11.3 9 10.5 9H9" stroke="currentColor" stroke-width="1.2"/></svg>
                        Copy
                    </button>
                </div>
            </div>
        </div>
    </template>

    <script src="/static/app.js"></script>
</body>
</html>
