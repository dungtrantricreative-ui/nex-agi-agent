<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanizer — AI Agent Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body class="bg-slate-50 h-screen overflow-hidden text-gray-800">

    <div class="flex h-full w-full">
        <div class="flex flex-col flex-1 h-full bg-white border-r border-gray-200">
            <div class="h-14 border-b border-gray-100 flex items-center justify-between px-6 bg-white shrink-0">
                <div class="flex items-center gap-2.5">
                    <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span class="font-semibold text-sm tracking-tight text-gray-900">Môi trường Đặc vụ AI v1.0</span>
                </div>
                <div id="processing-badge" class="hidden text-xs font-medium text-blue-600 bg-blue-50 border border-blue-100 px-2.5 py-1 rounded-full items-center gap-1.5">
                    <svg class="animate-spin" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><path d="M12 2v4"/></svg>
                    Đang xử lý dữ liệu...
                </div>
            </div>

            <div id="chat-scroll" class="flex-1 overflow-y-auto px-6 py-6 scroll-smooth bg-gray-50/50">
                <div id="chat-container" class="max-w-3xl mx-auto space-y-6">
                    
                    <div id="welcome-screen" class="py-12 text-center max-w-md mx-auto space-y-3 animate-in">
                        <div class="w-12 h-12 rounded-2xl bg-gray-900 text-white flex items-center justify-center mx-auto shadow-sm">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.886H3.856l5.056 3.674L6.999 18.45 12 14.775l5.001 3.675-1.913-5.215 5.056-3.674h-6.232Z"/></svg>
                        </div>
                        <h2 class="text-base font-semibold text-gray-900">Trợ lý Đặc vụ Thông minh</h2>
                        <p class="text-xs text-gray-500 leading-relaxed">Hãy nhập văn bản, yêu cầu viết mã nguồn hoặc tạo báo cáo. Đặc vụ sẽ tự động kích hoạt các công cụ và trả về kết quả thời gian thực.</p>
                    </div>

                </div>
            </div>

            <div class="p-4 bg-white border-t border-gray-100 shrink-0">
                <div class="max-w-3xl mx-auto space-y-2.5">
                    <div class="relative bg-gray-50 border border-gray-200 rounded-xl focus-within:border-gray-400 transition-colors p-2 flex flex-col gap-2">
                        <textarea id="input-text" rows="3" class="w-full bg-transparent border-0 resize-none outline-none focus:ring-0 text-sm text-gray-800 placeholder-gray-400 px-2 pt-1" placeholder="Nhập văn bản cần xử lý hoặc ra lệnh tạo file... (Ctrl + Enter để gửi)"></textarea>
                        
                        <div class="flex items-center justify-between border-t border-gray-100 pt-2 px-1">
                            <div class="flex items-center gap-2">
                                <select id="language-select" class="bg-white border border-gray-200 text-xs text-gray-600 rounded-lg px-2 py-1 outline-none cursor-pointer hover:border-gray-300 transition-colors">
                                    <option value="vi">Tiếng Việt</option>
                                    <option value="en">English</option>
                                </select>
                                <span class="text-[11px] text-gray-400 font-mono"><span id="char-count">0</span> ký tự</span>
                            </div>
                            
                            <button id="humanize-btn" class="inline-flex items-center gap-1.5 bg-gray-900 hover:bg-gray-800 disabled:bg-gray-200 disabled:text-gray-400 text-white font-medium text-xs px-3.5 py-1.5 rounded-lg transition shadow-sm select-none">
                                <span>Thực hiện</span>
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <template id="user-message-template">
        <div class="flex items-start justify-end user-bubble">
            <div class="max-w-[85%] bg-gray-900 text-white px-4 py-2.5 rounded-2xl rounded-tr-none text-sm leading-relaxed shadow-sm">
                <p class="whitespace-pre-wrap"></p>
            </div>
        </div>
    </template>

    <template id="steps-block-template">
        <div class="steps-block bg-gray-50 border border-gray-200 rounded-xl overflow-hidden shadow-sm animate-in">
            <div class="steps-toggle flex items-center justify-between px-3.5 py-2.5 bg-gray-50 hover:bg-gray-100/70 transition-colors cursor-pointer select-none border-b border-gray-100">
                <div class="flex items-center gap-2">
                    <svg class="steps-chevron text-gray-400 transition-transform" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                    <span class="text-xs font-semibold text-gray-700 tracking-tight flex items-center gap-1.5">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-500"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                        Tiến trình xử lý của Đặc vụ (<span class="steps-count">0</span> bước)
                    </span>
                </div>
                <div class="steps-done-badge hidden items-center gap-1 bg-emerald-50 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded border border-emerald-100">
                    HOÀN THÀNH
                </div>
            </div>
            <div class="steps-list p-2 space-y-1 bg-white hidden border-t border-gray-50"></div>
        </div>
    </template>

    <template id="step-item-template">
        <div class="step-item flex items-start gap-2.5 p-2 rounded-lg hover:bg-gray-50 transition-colors">
            <div class="step-icon mt-0.5 flex-shrink-0 flex items-center justify-center w-4 h-4"></div>
            <div class="flex-1 min-w-0">
                <div class="step-name text-xs font-medium text-gray-900 font-mono"></div>
                <div class="step-msg text-xs text-gray-400 mt-0.5 truncate"></div>
            </div>
        </div>
    </template>

    <template id="ai-message-template">
        <div class="ai-message-wrapper space-y-2">
            <div class="flex items-start gap-3">
                <div class="w-7 h-7 rounded-lg bg-gray-100 border border-gray-200 flex items-center justify-center shrink-0 text-gray-700 font-semibold text-xs select-none shadow-sm">AI</div>
                <div class="flex-1 min-w-0">
                    <div class="markdown-body text-sm text-gray-800 leading-relaxed"></div>
                    
                    <div class="flex items-center gap-1 mt-3 opacity-80 hover:opacity-100 transition-opacity">
                        <button class="copy-btn inline-flex items-center gap-1 text-[11px] text-gray-400 hover:text-gray-700 px-2 py-1 rounded-md hover:bg-gray-100 transition-colors">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                            Sao chép
                        </button>
                        <button class="like-btn inline-flex items-center gap-1 text-[11px] text-gray-400 hover:text-gray-700 px-2 py-1 rounded-md hover:bg-gray-100 transition-colors">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
                        </button>
                        <button class="dislike-btn inline-flex items-center gap-1 text-[11px] text-gray-400 hover:text-gray-700 px-2 py-1 rounded-md hover:bg-gray-100 transition-colors">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm12-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="/app.js"></script>
</body>
</html>
